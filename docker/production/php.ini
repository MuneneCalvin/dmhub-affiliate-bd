; Production PHP settings
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Code never changes inside a running container, so skip the timestamp checks.
opcache.validate_timestamps = 0
