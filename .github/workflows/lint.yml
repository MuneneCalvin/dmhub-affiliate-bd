name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Style is enforced on files changed in this push/PR only, so existing files
      # are not blocked until they are touched.
      - name: Find base commit
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="HEAD~1"; fi
            echo "sha=$BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Pint (changed PHP files)
        run: vendor/bin/pint --test --diff=${{ steps.base.outputs.sha }}

      - name: Prettier (changed frontend files)
        run: |
          FILES=$(git diff --name-only --diff-filter=d ${{ steps.base.outputs.sha }}...HEAD -- 'resources/**/*.ts' 'resources/**/*.tsx' 'resources/**/*.css' || true)
          if [ -n "$FILES" ]; then npx prettier --check $FILES; else echo "No frontend files changed"; fi

      - name: ESLint
        run: npx eslint .
